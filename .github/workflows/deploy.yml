name: Deploy

# Preview deploys run automatically on every push to `staging` and re-point
# staging.easytax.vip at the result. Production is manual only: run this
# workflow from the Actions tab with target=production.
#
# Production deploys `main` and nothing else. The `guard` step below hard-fails
# any other ref, so "deploy this branch straight to prod" is not reachable even
# by mistake.
#
# Why the guard exists: on 2026-09-05 production was found to be running an
# unmerged `claude/*` branch that was two commits ahead of both `main` and
# `staging`. Deploying `staging` at that moment would have silently deleted a
# live page. The rule that prevents a recurrence is one-directional — everything
# reaches production through `main` — and a rule that is only written down in
# CLAUDE.md is one an automated run can talk itself out of. This one is enforced.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: Which environment to deploy
        type: choice
        options: [preview, production]
        default: preview
        required: true
      ref:
        description: Branch or SHA to deploy (production ignores this and always deploys main)
        type: string
        default: staging
        required: true

concurrency:
  # Preview and production queue independently; never cancel a deploy midway.
  group: deploy-${{ inputs.target || 'preview' }}
  cancel-in-progress: false

env:
  VERCEL_SCOPE: lilingabriel-5465s-projects
  # Used only when VERCEL_ORG_ID / VERCEL_PROJECT_ID are not set, to link the
  # project by name instead. Change this if the Vercel project is named
  # something other than the repository.
  VERCEL_PROJECT_NAME: easytax
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  preview:
    if: github.event_name == 'push' || inputs.target == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `secrets` is not available to `if:` conditions, so gate on a step
      # output instead. This keeps the run green (with a warning) rather than
      # failing red before the token has been added.
      - name: Check Vercel credentials
        id: preflight
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Add VERCEL_TOKEN under Settings → Secrets and variables → Actions to enable deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --global vercel@latest

      # VERCEL_ORG_ID / VERCEL_PROJECT_ID identify the project exactly, but a
      # link by name needs only VERCEL_TOKEN. Prefer the IDs when both are set;
      # otherwise fall back to the name, listing the token's projects if that
      # name does not resolve.
      - name: Link Vercel project
        if: steps.preflight.outputs.ready == 'true'
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using VERCEL_ORG_ID / VERCEL_PROJECT_ID from secrets."
          else
            echo "IDs not set — linking by project name '$VERCEL_PROJECT_NAME'."
            if ! vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"; then
              echo "::error title=Link failed::Could not link project '$VERCEL_PROJECT_NAME'. Projects this token can see:"
              vercel projects ls --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
              exit 1
            fi
          fi

      # Build on Vercel, not in CI. A local `vercel build` does not get the
      # runtime environment variables (Supabase et al), and app/sitemap.ts
      # queries Supabase during prerender, so the build fails without them.
      # Uploading the source is also what the manual flow does.
      - name: Deploy preview
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point staging.easytax.vip at this deploy
        if: steps.preflight.outputs.ready == 'true'
        run: vercel alias set "${{ steps.deploy.outputs.url }}" staging.easytax.vip --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Summary
        if: steps.preflight.outputs.ready == 'true'
        run: |
          {
            echo "### Preview deployed"
            echo ""
            echo "- https://staging.easytax.vip"
            echo "- ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Check the preview, then run this workflow again with \`target: production\` to go live."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment in Settings → Environments
    # to require an approval click before anything reaches easytax.vip.
    environment:
      name: production
      url: https://easytax.vip
    steps:
      # Production ships `main`, whatever the dispatcher typed. Failing loudly
      # beats silently deploying something else, so a non-main ref stops the run
      # here rather than being quietly rewritten.
      - name: Refuse to deploy anything but main
        run: |
          ref='${{ inputs.ref }}'
          if [ -n "$ref" ] && [ "$ref" != "main" ]; then
            echo "::error title=Production deploys main only::Asked to deploy '$ref'. Everything reaches production through main: open a PR into main, merge it, then run this workflow with ref=main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Pinned, not ${{ inputs.ref }} — the guard above has already
          # established that the only acceptable value is main.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing secret::Add VERCEL_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using VERCEL_ORG_ID / VERCEL_PROJECT_ID from secrets."
          else
            echo "IDs not set — linking by project name '$VERCEL_PROJECT_NAME'."
            if ! vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"; then
              echo "::error title=Link failed::Could not link project '$VERCEL_PROJECT_NAME'. Projects this token can see:"
              vercel projects ls --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
              exit 1
            fi
          fi

      # Build on Vercel, not in CI — see the note in the preview job.
      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope "$VERCEL_SCOPE")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- https://easytax.vip"
            echo "- Deployed ref: \`main\` @ \`${{ github.sha }}\`"
            echo "- ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "\`main\` is what was deployed, so there is nothing to sync afterwards."
            echo "To bring \`staging\` back in line for review: \`git push origin main:staging\`."
          } >> "$GITHUB_STEP_SUMMARY"
